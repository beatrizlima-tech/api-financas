spring:
  application:
    name: api-financas

  profiles:
    default: dev

  jpa:
    open-in-view: false

server:
  port: ${SERVER_PORT:8083}

cors:
  frontend: ${CORS_FRONTEND:http://localhost:4200}

jwt:
  issuer: ${JWT_ISSUER:api-autenticacao}
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never